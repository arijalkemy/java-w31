spring.application.name=elastic

# Elasticsearch Configuration
spring.elasticsearch.uris=localhost:9200
spring.elasticsearch.connection-timeout=1000
spring.elasticsearch.socket-timeout=30000

# Additional Elasticsearch Configuration
spring.elasticsearch.restclient.sniffer.interval=300000
spring.elasticsearch.restclient.sniffer.delay-after-failure=30000
spring.data.elasticsearch.repositories.enabled=true
spring.data.elasticsearch.auto-create-index=true

# Configuración específica para Elasticsearch 8.x
spring.elasticsearch.ssl.verification-mode=none
spring.elasticsearch.username=
spring.elasticsearch.password=